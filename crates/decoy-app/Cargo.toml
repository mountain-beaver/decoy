[package]
name = "decoy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared app logic of Decoy: controller, game list and the local RPC between daemon and UI"

[dependencies]
decoy-core = { path = "../decoy-core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
