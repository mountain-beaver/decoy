name: pages

# Publishes the small website in site/ to GitHub Pages. Its pictures are the
# same files the README uses, copied in at build time.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/*.png', 'assets/icon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp docs/*.png assets/icon.svg _site/img/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
