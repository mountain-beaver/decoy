name: release

# A tag like v1.2.3 builds installers for every system and attaches them to a
# draft release. Started by hand, it only builds them and keeps them as
# workflow artifacts, which is how to try a build before tagging.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # On Linux the build first runs scripts/prepare-daemon.sh (see
      # src-tauri/tauri.linux.conf.json), which builds the tray daemon sidecar.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: 'Decoy v__VERSION__'
          releaseBody: 'Download the installer for your system from the assets below.'
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
