name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      # Tests with a fake Discord run on Unix only; on Windows what matters is that the core builds and passes the rest.
      - run: cargo test -p decoy-core
      - run: cargo clippy -p decoy-core --all-targets -- -D warnings
      # Controller, game list and local RPC (the RPC tests run on Unix only).
      - run: cargo test -p decoy-app
      - run: cargo clippy -p decoy-app --all-targets -- -D warnings

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # On Linux the tray lives in a separate daemon; Tauri expects it as a sidecar, so it is built first.
      - name: Prepare tray daemon
        if: runner.os == 'Linux'
        run: bash scripts/prepare-daemon.sh --debug
      - name: Test tray daemon
        if: runner.os == 'Linux'
        run: |
          cargo test -p decoy-daemon
          cargo clippy -p decoy-daemon --all-targets -- -D warnings
      - run: cargo test -p decoy
      - run: cargo clippy -p decoy --all-targets -- -D warnings
