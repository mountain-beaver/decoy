[package]
name = "decoy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Custom Discord Rich Presence for every desktop"

[lib]
name = "decoy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
decoy-app = { path = "../crates/decoy-app" }
decoy-core = { path = "../crates/decoy-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"

# Windows and macOS keep the tray in this process. On Linux the tray lives in
# decoy-daemon, so this process must not pull in the tray (and its appindicator) at all.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.12.7", features = ["image-png", "tray-icon"] }

# Same gtk that Tauri already uses; only for the DPI guard before the window is built.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
libc = "0.2.191"
# Same webkit2gtk as wry; only to switch on GPU compositing and smooth scrolling.
webkit2gtk = "2.0.2"

[dev-dependencies]
tempfile = "3.27.0"
